server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Раздача собранного React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси запросов к API на backend по имени Docker-сервиса.
    # Браузер обращается к тому же origin (nginx), поэтому CORS не нужен,
    # а сам nginx достаёт backend по внутреннему DNS-имени "backend".
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
