services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-survey-backend
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - mini-survey-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: mini-survey-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - mini-survey-network

networks:
  mini-survey-network:
    driver: bridge
